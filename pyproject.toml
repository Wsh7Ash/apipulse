[build-system]
requires=["setuptools>=61.0"]
build-backend="setuptools.build_meta"
[project]
name="apipulse"
version="0.1.0"
description="Health check aggregator for backend services"
readme="README.md"
requires-python=">=3.10"
dependencies=["click>=8.1.0","requests>=2.31.0","rich>=13.0.0"]
[project.scripts]
apipulse="apipulse.cli:main"
[tool.setuptools.packages.find]
where=["src"]
